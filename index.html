<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>実験器具学習サイト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>オシロスコープ</h1>
    <div class="instrument-container">
        <img src="oscilloscope.png" alt="オシロスコープ">
        <!-- 電源ボタンの領域 -->
        <div class="hotspot" id="power-button"></div>
        <!-- 説明文表示エリア -->
        <div class="tooltip"></div>

            <!-- オシロスコープの画面領域 -->
        <div id="screen">
            <!-- 波形画像imgの代わりに、描画用のcanvasを設置 -->
            <canvas id="oscilloscope-screen" width="400" height="300"></canvas>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
