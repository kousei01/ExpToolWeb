<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>実験器具学習サイト</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========================================== -->
<!-- コントロールパネル -->
<!-- ========================================== -->
<div class="control-panel">
    
    <!-- 1. モデル切り替えグループ -->
    <div class="control-group">
        <span class="panel-label">MODEL SELECT</span>
        <div class="button-group">
            <button id="btn-model-hantek" class="panel-btn active" onclick="switchModelUI('hantek')">Hantek</button>
            <button id="btn-model-agilent" class="panel-btn" onclick="switchModelUI('agilent')">Agilent</button>
        </div>
    </div>

    <!-- 区切り線 -->
    <div class="panel-divider"></div>

    <!-- 2. ズーム操作グループ -->
    <div class="control-group">
        <span class="panel-label">VIEW SCALE</span>
        <div class="zoom-controls">
            <button class="panel-btn icon-btn" onclick="changeZoom(-10)">－</button>
            <div class="zoom-display-screen">
                <span id="zoom-display">100%</span>
            </div>
            <button class="panel-btn icon-btn" onclick="changeZoom(10)">＋</button>
        </div>
    </div>

    <!-- 区切り線 -->
    <div class="panel-divider"></div>

    <!-- 3. 信号操作グループ (新規追加) -->
    <div class="control-group">
        <span class="panel-label">SIGNAL GEN</span>
        
        <!-- 波形切り替え -->
        <div class="button-group" style="margin-bottom: 4px;">
            <button class="panel-btn active" id="btn-wave-sine" onclick="setWaveType('sine')">Sine</button>
            <button class="panel-btn" id="btn-wave-square" onclick="setWaveType('square')">Square</button>
            <button class="panel-btn" id="btn-wave-tri" onclick="setWaveType('tri')">Tri</button>
        </div>

        <!-- 振幅調整 -->
        <div class="button-group">
            <span style="font-size:10px; color:#aaa; margin-right:5px;">AMP:</span>
            <button class="panel-btn icon-btn" onclick="changeSignalAmplitude(-0.5)">－</button>
            <button class="panel-btn icon-btn" onclick="changeSignalAmplitude(0.5)">＋</button>
        </div>
    </div>

    <div style="text-align:center; margin-bottom:10px;">
        <button class="panel-btn active" style="background:#e74c3c; border-color:#c0392b;" onclick="startTestMode()">★ 実技テストを開始する</button>
    </div>
    
</div>

<div id="test-panel" class="test-panel" style="display:none;">
    <div class="test-header">
        <h3>実技試験モード</h3>
        <span id="question-counter">Q 1 / 3</span>
    </div>
    <div class="test-body">
        <p id="question-text">ここに問題が表示されます。</p>
        <div id="test-feedback"></div>
    </div>
    <div class="test-footer">
        <button id="btn-check-answer" class="panel-btn" onclick="checkTestAnswer()">解答する</button>
        <button id="btn-next-question" class="panel-btn" style="display:none;" onclick="nextQuestion()">次の問題へ</button>
    </div>
</div>


<!-- メインステージ（ここが重要：オシロスコープ表示エリア） -->
<div class="main-stage">

    <!-- ========================================== -->
    <!-- モデルA: Hantek -->
    <!-- ========================================== -->
    <div id="model-hantek" class="instrument-container active-model">
        <img src="oscilloscope-body.png" alt="Hantekオシロスコープ">
        
        <div id="screen-hantek" class="screen-area">
            <canvas id="canvas-hantek" width="610" height="360"></canvas>
        </div>
        
        <map name="map-hantek">
            <!-- 既存のボタン定義 -->
            <area target="" alt="電源ボタン" title="電源ボタン" coords="134,703,18" shape="circle">
            <area target="" alt="CH1_MENU" title="CH1_MENU" coords="880,516,835,488" shape="rect">
            <area target="" alt="CH2_MENU" title="CH2_MENU" coords="968,487,1013,517" shape="rect">
            <area target="" alt="RunStop" title="RunStop" coords="1202,269,1246,298" shape="rect">
            <area target="" alt="AutoSet" title="AutoSet" coords="1131,241,1177,270" shape="rect">
            <area target="" alt="Single" title="Single" coords="1131,292,1177,322" shape="rect">
            <area target="" alt="Acquire" title="Acquire" coords="1061,238,1106,270" shape="rect">
            <area target="" alt="Measure" title="Measure" coords="994,241,1039,268" shape="rect">
            <area target="" alt="SaveRecall" title="SaveRecall" coords="927,240,972,269" shape="rect">
            <area target="" alt="Display" title="Display" coords="1061,292,1106,322" shape="rect">
            <area target="" alt="Cursor" title="Cursor" coords="994,292,1038,321" shape="rect">
            <area target="" alt="Utility" title="Utility" coords="927,293,971,320" shape="rect">
            <area target="" alt="F1" title="F1" coords="733,337,770,363" shape="rect">
            <area target="" alt="F2" title="F2" coords="733,398,770,419" shape="rect">
            <area target="" alt="F3" title="F3" coords="733,456,771,479" shape="rect">
            <area target="" alt="F4" title="F4" coords="733,515,771,539" shape="rect">
            <area target="" alt="F5" title="F5" coords="733,573,771,596" shape="rect">
            <area target="" alt="Ch1" title="Ch1" coords="861,683,18" shape="circle">
            <area target="" alt="Ch2" title="Ch2" coords="992,684,18" shape="circle">
            <area target="" alt="電圧調整" title="KNOB_VOLT" href="" coords="861,583,30" shape="circle">
            <area target="" alt="時間調整" title="KNOB_TIME" href="" coords="991,582,31" shape="circle">
        </map>
    </div>

    <!-- ========================================== -->
    <!-- モデルB: Agilent -->
    <!-- ========================================== -->
    <div id="model-agilent" class="instrument-container" style="display: none;">
        <img src="agilent-body.png" alt="Agilentオシロスコープ">
        
        <div id="screen-agilent" class="screen-area">
            <canvas id="canvas-agilent" width="1110" height="665"></canvas>
        </div>

        <map name="map-agilent">
            <area target="" alt="電源ボタン" title="電源ボタン" coords="172,1030,250,1084" shape="rect">
            <area target="" alt="CH1_MENU" title="CH1_MENU" coords="1519,743,1561,809" shape="rect">
            <area target="" alt="CH2_MENU" title="CH2_MENU" coords="1708,741,1742,807" shape="rect">
            <area target="" alt="CH3_MENU" title="CH3_MENU" coords="1895,741,1931,805" shape="rect">
            <area target="" alt="CH4_MENU" title="CH4_MENU" coords="2081,740,2119,808" shape="rect">
            <area target="" alt="RunStop" title="RunStop" coords="1894,103,2007,154" shape="rect">
            <area target="" alt="Single" title="Single" coords="2037,102,2152,153" shape="rect">
            <area target="" alt="時間ツマミ" title="KNOB_TIME" coords="1494,167,41" shape="circle">
            <area target="" alt="電圧ツマミ" title="KNOB_VOLT" coords="1544,673,36" shape="circle">
        </map>
    </div>

</div> <!-- /.main-stage -->

<!-- ツールチップ用 -->
<div id="tooltip-hantek" class="tooltip"></div>
<div id="tooltip-agilent" class="tooltip"></div>

<!-- JavaScriptファイルの読み込み -->
<script src="script.js"></script>

</body>
</html>
